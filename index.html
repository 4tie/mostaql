<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <link rel="icon" href="data:," />
    <title>مصروفاتي</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8eef8;
        --muted: #9ba9bd;
        --line: #263348;
        --brand: #5487ff;
        --brand-dark: #3f70de;
        --surface: #151e2d;
        --canvas: #0b1120;
        --green: #15845b;
        --shadow: 0 16px 48px rgba(0, 0, 0, 0.24);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at 8% 0%, rgba(47, 111, 237, 0.14), transparent 28rem),
          var(--canvas);
        color: var(--ink);
        font-family: Tahoma, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, input, select { font: inherit; }
      button { cursor: pointer; }

      .page-shell {
        width: min(100% - 36px, 960px);
        margin: 0 auto;
        padding: 46px 0 64px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 30px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .brand-mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 16px;
        background: var(--brand);
        color: #fff;
        box-shadow: 0 8px 18px rgba(47, 111, 237, 0.23);
      }

      .brand-mark svg { width: 25px; height: 25px; }
      .brand h1 { margin: 0; font-size: 25px; letter-spacing: -0.5px; }
      .brand p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }

      .today {
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(21, 30, 45, 0.82);
        color: #b8c4d6;
        font-size: 13px;
        white-space: nowrap;
      }

      .summary {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 168px;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 30px 34px;
        border-radius: 22px;
        background: linear-gradient(120deg, #1d4594, #2868cc);
        color: #fff;
        box-shadow: 0 18px 38px rgba(47, 111, 237, 0.19);
      }

      .summary::before, .summary::after {
        position: absolute;
        content: "";
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 50%;
        pointer-events: none;
      }
      .summary::before { width: 280px; height: 280px; left: 8%; top: -205px; }
      .summary::after { width: 190px; height: 190px; left: 25%; bottom: -155px; }
      .summary-copy, .summary-icon { position: relative; z-index: 1; }
      .summary-label { margin: 0 0 13px; color: rgba(255,255,255,.78); font-size: 14px; }
      .total-line { display: flex; align-items: baseline; gap: 9px; }
      .total { font-size: clamp(34px, 7vw, 48px); font-weight: 700; letter-spacing: -1.4px; }
      .currency { color: rgba(255,255,255,.8); font-size: 15px; }
      .summary-count { margin: 12px 0 0; color: rgba(255,255,255,.79); font-size: 13px; }

      .summary-icon {
        display: grid;
        width: 66px;
        height: 66px;
        place-items: center;
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 20px;
        background: rgba(255,255,255,.12);
      }
      .summary-icon svg { width: 33px; height: 33px; }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(260px, .82fr) minmax(0, 1.18fr);
        gap: 22px;
        align-items: start;
        margin-top: 24px;
      }

      .card {
        border: 1px solid rgba(48, 64, 85, .82);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .form-card { padding: 24px; }
      .section-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
      .heading-icon {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 11px;
        background: #1c2b45;
        color: var(--brand);
      }
      .heading-icon svg { width: 19px; height: 19px; }
      .section-heading h2 { margin: 0; font-size: 17px; }
      .field { margin-bottom: 16px; }
      .field label { display: block; margin: 0 0 8px; color: #c0cbda; font-size: 13px; font-weight: 700; }
      .field input, .field select {
        width: 100%;
        height: 46px;
        padding: 0 13px;
        border: 1px solid #2b384c;
        border-radius: 11px;
        outline: none;
        background: #0f1726;
        color: var(--ink);
        transition: border-color .15s, box-shadow .15s;
      }
      .field input::placeholder { color: #7e8da2; }
      .field input:focus, .field select:focus {
        border-color: #7aa4f5;
        box-shadow: 0 0 0 3px rgba(47, 111, 237, .12);
      }
      .amount-wrap { position: relative; }
      .amount-wrap input { padding-left: 54px; }
      .amount-suffix {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: #8894a5;
        font-size: 12px;
        pointer-events: none;
      }
      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .submit-button {
        display: flex;
        width: 100%;
        height: 48px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 5px;
        border: 0;
        border-radius: 12px;
        background: var(--brand);
        color: #fff;
        font-weight: 700;
        transition: background .15s, transform .15s;
      }
      .submit-button:hover { background: var(--brand-dark); }
      .submit-button:active { transform: translateY(1px); }
      .submit-button svg { width: 18px; height: 18px; }

      .list-card { min-height: 348px; padding: 24px; }
      .list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 15px;
      }
      .list-header .section-heading { margin: 0; }
      .entry-count {
        padding: 6px 10px;
        border-radius: 999px;
        background: #202b3b;
        color: #b5c1d1;
        font-size: 12px;
        white-space: nowrap;
      }
      .expense-list { display: grid; gap: 10px; }
      .expense-item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 13px 12px;
        border: 1px solid #263246;
        border-radius: 13px;
        animation: appear .2s ease-out;
      }
      @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      .category-icon {
        display: grid;
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        place-items: center;
        border-radius: 13px;
        background: #202a3a;
        font-size: 19px;
      }
      .expense-info { flex: 1; min-width: 0; }
      .expense-name {
        overflow: hidden;
        margin: 0;
        color: #e2eaf5;
        font-size: 14px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .expense-meta { margin: 5px 0 0; color: #98a6ba; font-size: 11px; }
      .expense-side { display: flex; align-items: center; gap: 10px; }
      .expense-amount { color: #eef3fb; font-size: 14px; font-weight: 700; white-space: nowrap; }
      .delete-button {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #9ba5b2;
        transition: background .15s, color .15s;
      }
      .delete-button:hover { background: #4b252c; color: #ff8a98; }
      .delete-button svg { width: 16px; height: 16px; }
      .empty-state {
        display: grid;
        min-height: 240px;
        align-content: center;
        justify-items: center;
        padding: 24px;
        text-align: center;
      }
      .empty-illustration {
        display: grid;
        width: 66px;
        height: 66px;
        place-items: center;
        margin-bottom: 14px;
        border-radius: 21px;
        background: #202b3b;
        color: #a7b7cf;
      }
      .empty-illustration svg { width: 30px; height: 30px; }
      .empty-state h3 { margin: 0; font-size: 15px; }
      .empty-state p { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }
      .toast {
        position: fixed;
        right: 50%;
        bottom: 24px;
        z-index: 5;
        padding: 12px 18px;
        transform: translate(50%, 20px);
        border-radius: 12px;
        background: #1d2b40;
        color: white;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: .2s ease;
      }
      .toast.show { transform: translate(50%, 0); opacity: 1; }
      select option { background: #0f1726; color: var(--ink); }

      @media (max-width: 720px) {
        .page-shell { width: min(100% - 28px, 520px); padding-top: 28px; }
        .content-grid { grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
        .topbar { margin-bottom: 22px; }
        .summary { min-height: 148px; padding: 24px; }
      }
      @media (max-width: 420px) {
        .page-shell { width: min(100% - 22px, 520px); }
        .brand-mark { width: 43px; height: 43px; border-radius: 14px; }
        .brand h1 { font-size: 21px; }
        .brand p { font-size: 11px; }
        .today { padding: 8px 10px; font-size: 11px; }
        .summary { padding: 21px; }
        .summary-icon { width: 54px; height: 54px; border-radius: 17px; }
        .form-card, .list-card { padding: 20px 17px; }
        .form-row { gap: 9px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H20v14H6.5A2.5 2.5 0 0 1 4 16.5v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M4.5 8H20m-5 5h2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M7 5v14" stroke="currentColor" stroke-width="1.5" opacity=".55"/>
            </svg>
          </div>
          <div>
            <h1>مصروفاتي</h1>
            <p>تابع مصروفاتك اليومية بسهولة</p>
          </div>
        </div>
        <div class="today" id="todayLabel"></div>
      </header>

      <section class="summary" aria-label="ملخص المصروفات">
        <div class="summary-copy">
          <p class="summary-label">إجمالي مصروفاتك</p>
          <div class="total-line">
            <span class="total" id="totalAmount">٠</span>
            <span class="currency">ر.س</span>
          </div>
          <p class="summary-count" id="summaryCount">لا توجد مصروفات مسجلة</p>
        </div>
        <div class="summary-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 18.5V12m5 6.5V5.5m5 13v-9m5 9V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 21h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".65"/>
          </svg>
        </div>
      </section>

      <div class="content-grid">
        <section class="card form-card" aria-labelledby="formTitle">
          <div class="section-heading">
            <span class="heading-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <h2 id="formTitle">أضف مصروفاً</h2>
          </div>
          <form id="expenseForm">
            <div class="field">
              <label for="expenseName">اسم المصروف</label>
              <input id="expenseName" name="name" type="text" maxlength="60" placeholder="مثال: قهوة الصباح" required autocomplete="off" />
            </div>
            <div class="field">
              <label for="expenseAmount">المبلغ</label>
              <div class="amount-wrap">
                <input id="expenseAmount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required inputmode="decimal" />
                <span class="amount-suffix">ر.س</span>
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="expenseCategory">التصنيف</label>
                <select id="expenseCategory" name="category">
                  <option value="food">طعام</option>
                  <option value="transport">مواصلات</option>
                  <option value="shopping">تسوق</option>
                  <option value="bills">فواتير</option>
                  <option value="other">أخرى</option>
                </select>
              </div>
              <div class="field">
                <label for="expenseDate">التاريخ</label>
                <input id="expenseDate" name="date" type="date" required />
              </div>
            </div>
            <button class="submit-button" type="submit">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14m-7-7h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              إضافة المصروف
            </button>
          </form>
        </section>

        <section class="card list-card" aria-labelledby="listTitle">
          <div class="list-header">
            <div class="section-heading">
              <span class="heading-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M7 6h13M7 12h13M7 18h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  <circle cx="3.5" cy="6" r="1" fill="currentColor"/>
                  <circle cx="3.5" cy="12" r="1" fill="currentColor"/>
                  <circle cx="3.5" cy="18" r="1" fill="currentColor"/>
                </svg>
              </span>
              <h2 id="listTitle">آخر المصروفات</h2>
            </div>
            <span class="entry-count" id="entryCount">٠ مصروفات</span>
          </div>
          <div class="expense-list" id="expenseList" aria-live="polite"></div>
        </section>
      </div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const STORAGE_KEY = "masroofati-expenses-v1";
      const categories = {
        food: { label: "طعام", icon: "🍽️" },
        transport: { label: "مواصلات", icon: "🚗" },
        shopping: { label: "تسوق", icon: "🛍️" },
        bills: { label: "فواتير", icon: "🧾" },
        other: { label: "أخرى", icon: "📌" }
      };
      const numberFormat = new Intl.NumberFormat("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      const dateFormat = new Intl.DateTimeFormat("ar-SA", { day: "numeric", month: "short", year: "numeric" });
      const form = document.getElementById("expenseForm");
      const list = document.getElementById("expenseList");
      const todayInput = document.getElementById("expenseDate");
      const toast = document.getElementById("toast");
      let expenses = loadExpenses();
      let toastTimer;

      function localDateString(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function loadExpenses() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(stored) ? stored.filter((item) =>
            item && typeof item.id === "string" && typeof item.name === "string" &&
            Number.isFinite(Number(item.amount)) && Number(item.amount) > 0 &&
            typeof item.date === "string"
          ) : [];
        } catch {
          return [];
        }
      }

      function saveExpenses() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
        } catch {
          showToast("تعذر حفظ البيانات على هذا الجهاز");
        }
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
      }

      function formatDate(value) {
        const [year, month, day] = value.split("-").map(Number);
        return dateFormat.format(new Date(year, month - 1, day));
      }

      function deleteIcon() {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("aria-hidden", "true");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M4 7h16m-10 4v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3");
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "1.7");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        svg.append(path);
        return svg;
      }

      function render() {
        const total = expenses.reduce((sum, item) => sum + Number(item.amount), 0);
        document.getElementById("totalAmount").textContent = numberFormat.format(total);
        document.getElementById("summaryCount").textContent = expenses.length
          ? `لديك ${numberFormat.format(expenses.length)} ${expenses.length === 1 ? "مصروف مسجل" : "مصروفات مسجلة"}`
          : "لا توجد مصروفات مسجلة";
        document.getElementById("entryCount").textContent = `${numberFormat.format(expenses.length)} مصروفات`;
        list.replaceChildren();

        if (!expenses.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const icon = document.createElement("div");
          icon.className = "empty-illustration";
          icon.setAttribute("aria-hidden", "true");
          icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H20v14H6.5A2.5 2.5 0 0 1 4 16.5v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4.5 8H20m-5 5h2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
          const title = document.createElement("h3");
          title.textContent = "قائمتك فارغة حالياً";
          const message = document.createElement("p");
          message.textContent = "أضف أول مصروف لتبدأ بمتابعة إنفاقك";
          empty.append(icon, title, message);
          list.append(empty);
          return;
        }

        [...expenses]
          .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt)
          .forEach((expense) => {
            const category = categories[expense.category] || categories.other;
            const item = document.createElement("article");
            item.className = "expense-item";
            const icon = document.createElement("span");
            icon.className = "category-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = category.icon;
            const info = document.createElement("div");
            info.className = "expense-info";
            const name = document.createElement("p");
            name.className = "expense-name";
            name.textContent = expense.name;
            const meta = document.createElement("p");
            meta.className = "expense-meta";
            meta.textContent = `${category.label} · ${formatDate(expense.date)}`;
            info.append(name, meta);
            const side = document.createElement("div");
            side.className = "expense-side";
            const amount = document.createElement("span");
            amount.className = "expense-amount";
            amount.textContent = `${numberFormat.format(Number(expense.amount))} ر.س`;
            const remove = document.createElement("button");
            remove.className = "delete-button";
            remove.type = "button";
            remove.setAttribute("aria-label", `حذف مصروف ${expense.name}`);
            remove.title = "حذف المصروف";
            remove.append(deleteIcon());
            remove.addEventListener("click", () => {
              expenses = expenses.filter((entry) => entry.id !== expense.id);
              saveExpenses();
              render();
              showToast("تم حذف المصروف");
            });
            side.append(amount, remove);
            item.append(icon, info, side);
            list.append(item);
          });
      }

      document.getElementById("todayLabel").textContent = new Intl.DateTimeFormat("ar-SA", {
        weekday: "long", day: "numeric", month: "long"
      }).format(new Date());
      todayInput.value = localDateString();

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        const data = new FormData(form);
        const expense = {
          id: typeof crypto.randomUUID === "function" ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          name: String(data.get("name")).trim(),
          amount: Number(data.get("amount")),
          category: String(data.get("category")),
          date: String(data.get("date")),
          createdAt: Date.now()
        };
        if (!expense.name || !Number.isFinite(expense.amount) || expense.amount <= 0) return;
        expenses.push(expense);
        saveExpenses();
        render();
        form.reset();
        todayInput.value = localDateString();
        document.getElementById("expenseName").focus();
        showToast("تمت إضافة المصروف");
      });

      render();
    </script>
  </body>
</html>
